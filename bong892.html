<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>부트스트랩 벤토 그리드 페이지</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome 아이콘 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- 커스텀 벤토 CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light text-dark">

    <!-- 네비게이션바 -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white px-4 border-bottom shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold text-primary" href="#">로고</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link active" href="#">홈</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">서비스</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">문의하기</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- 벤토 그리드 메인 섹션 -->
    <main class="container py-5">
        <div class="bento-grid">
            <!-- 1. 업무 (크고 강조된 카드 - 소프트 블루 파스텔) -->
            <div class="bento-card bento-large pastel-blue">
                <div class="card-content">
                    <i class="fa-solid fa-briefcase fa-2x mb-3 text-primary"></i>
                    <h3>업무</h3>
                    <p class="text-muted">핵심 업무 및 프로젝트 관리 영역입니다.</p>
                </div>
            </div>

            <!-- 2. 교육 (소프트 핑크 파스텔) -->
            <div class="bento-card pastel-pink">
                <div class="card-content">
                    <i class="fa-solid fa-graduation-cap fa-xl mb-2 text-danger"></i>
                    <h4>교육</h4>
                </div>
            </div>

            <!-- 3. 취미 (소프트 옐로우 파스텔) -->
            <div class="bento-card pastel-yellow">
                <div class="card-content">
                    <i class="fa-solid fa-gamepad fa-xl mb-2 text-warning"></i>
                    <h4>취미</h4>
                </div>
            </div>

            <!-- 4. 가족 (소프트 그린 파스텔) -->
            <div class="bento-card pastel-green">
                <div class="card-content">
                    <i class="fa-solid fa-users fa-xl mb-2 text-success"></i>
                    <h4>가족</h4>
                </div>
            </div>

            <!-- 5. 선교 (와이드 카드 - 소프트 퍼플 파스텔) -->
            <div class="bento-card bento-wide pastel-purple">
                <div class="card-content d-flex flex-column flex-md-row justify-content-between align-items-md-center">
                    <div class="mb-3 mb-md-0">
                        <i class="fa-solid fa-globe fa-xl mb-2 text-info"></i>
                        <h4>선교</h4>
                        <p class="text-muted mb-0">선교 관련 활동 및 정보 모음</p>
                    </div>
                    <div class="links-group">
                        <a href="#" class="btn btn-sm btn-outline-dark me-1">선교회</a>
                        <a href="#" class="btn btn-sm btn-outline-dark me-1">결재</a>
                        <a href="#" class="btn btn-sm btn-outline-dark me-1">일정</a>
                        <a href="#" class="btn btn-sm btn-dark text-white">업무관리</a>
                    </div>
                </div>
            </div>

            <!-- 6. 기타 (소프트 그레이 파스텔) -->
            <div class="bento-card pastel-gray">
                <div class="card-content">
                    <i class="fa-solid fa-ellipsis fa-xl mb-2 text-secondary"></i>
                    <h4>기타</h4>
                </div>
            </div>
        </div>
    </main>

    <!-- 푸터 -->
    <footer class="bg-white text-muted py-4 border-top px-4 shadow-sm">
        <div class="container-fluid d-flex flex-column flex-md-row justify-content-between align-items-center">
            <div>
                <h6 class="text-dark fw-bold">회사 정보</h6>
                <p class="mb-1">주소: 서울특별시 강남구 테헤란로</p>
                <p class="mb-0">전화: 02-1234-5678</p>
            </div>
            <div class="mt-3 mt-md-0">
                <h6 class="text-dark fw-bold text-md-end">SNS</h6>
                <div>
                    <a href="#" class="text-muted text-decoration-none me-3">Facebook</a>
                    <a href="#" class="text-muted text-decoration-none me-3">Twitter</a>
                    <a href="#" class="text-muted text-decoration-none">Instagram</a>
                </div>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
